<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arcana Pairing Oracle — Luxe Edition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cinzel+Decorative:wght@700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#0A0812; --panel:#1A1024; --panel-2:#241832;
    --gold:#C8D4DC; --gold-dim:#8A96A0; --amethyst:#B78CD6; --amethyst-soft:#CBA8E0;
    --parchment:#E8EAED; --parchment-dim:#9AA0A8; --line:rgba(200,212,220,0.22); --ok:#7FB88A;
  }
  *{box-sizing:border-box;} html,body{margin:0;padding:0;}
  body{background:radial-gradient(ellipse at 20% -10%, rgba(183,140,214,0.25), transparent 55%),radial-gradient(ellipse at 85% 10%, rgba(200,212,220,0.10), transparent 45%),var(--void); color:var(--parchment); font-family:'EB Garamond', serif; min-height:100vh; -webkit-font-smoothing:antialiased;}
  ::selection{background:var(--amethyst); color:var(--void);}
  .stars{position:fixed; inset:0; pointer-events:none; z-index:0; opacity:0.5;}
  .wrap{position:relative; z-index:1; max-width:820px; margin:0 auto; padding:40px 24px 100px;}
  .bonus-banner{max-width:820px; margin:0 auto 28px; background:linear-gradient(90deg, rgba(200,212,220,0.12), rgba(183,140,214,0.08)); border:1px solid var(--line); border-radius:3px; padding:12px 20px; text-align:center; font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:0.05em; color:var(--gold);}
  header.top{text-align:center; margin-bottom:36px;}
  .eyebrow{font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:0.3em; text-transform:uppercase; color:var(--gold-dim); margin-bottom:12px;}
  h1{font-family:'Cinzel Decorative','Cinzel',serif; font-weight:700; font-size:clamp(28px,4.5vw,42px); margin:0 0 10px;}
  h1 span{color:var(--amethyst-soft);}
  .sub{font-size:15.5px; color:var(--parchment-dim); max-width:560px; margin:0 auto; font-style:italic;}
  .sigil-divider{width:100px; height:1px; margin:22px auto 0; background:linear-gradient(90deg, transparent, var(--gold), transparent); position:relative;}
  .sigil-divider::before{content:"◆"; position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); color:var(--gold); font-size:9px; background:var(--void); padding:0 10px;}
  .panel{background:linear-gradient(180deg, var(--panel), var(--panel-2)); border:1px solid var(--line); border-radius:4px; padding:32px; position:relative; text-align:center;}
  .panel::before,.panel::after{content:""; position:absolute; width:14px; height:14px; border:1px solid var(--gold-dim); opacity:0.6;}
  .panel::before{top:-1px; left:-1px; border-right:none; border-bottom:none;}
  .panel::after{bottom:-1px; right:-1px; border-left:none; border-top:none;}
  .btn{font-family:'Cinzel',serif; font-size:13px; letter-spacing:0.05em; padding:16px 40px; border-radius:2px; cursor:pointer; border:1px solid transparent; transition:all .18s ease; text-transform:uppercase;}
  .btn-primary{background:linear-gradient(180deg, var(--gold), var(--gold-dim)); color:var(--void); font-weight:600;}
  .btn-primary:hover{filter:brightness(1.08); box-shadow:0 4px 22px rgba(200,212,220,0.25);}
  .result-card{display:none; text-align:left; margin-top:32px; padding-top:28px; border-top:1px solid var(--line);}
  .result-card.show{display:block;}
  .pairing-row{display:flex; align-items:center; justify-content:center; gap:16px; margin-bottom:20px; flex-wrap:wrap;}
  .pairing-chip{border:1px solid var(--gold); border-radius:3px; padding:12px 20px; font-family:'Cinzel',serif; font-size:15px; color:var(--gold); background:rgba(200,212,220,0.06);}
  .pairing-plus{font-family:'JetBrains Mono',monospace; color:var(--amethyst-soft); font-size:18px;}
  .reasoning{font-size:15.5px; line-height:1.75; color:var(--parchment-dim); text-align:center; max-width:600px; margin:0 auto;}
  .reasoning b{color:var(--parchment); font-weight:normal; font-style:italic;}
  .toolbar{display:flex; justify-content:center; gap:10px; margin-top:26px;}
  .btn-ghost{background:transparent; border-color:var(--line); color:var(--parchment-dim); font-size:11px; padding:8px 16px;}
  .btn-ghost:hover{border-color:var(--amethyst-soft); color:var(--parchment);}
</style>
</head>
<body>
<canvas class="stars"></canvas>
<div class="wrap">
  <div class="bonus-banner">✦ ARCANA DECK AI — LUXE EDITION BONUS · unlimited theme + style pairing suggestions ✦</div>
  <header class="top">
    <div class="eyebrow">Theme × Luxe Style Pairing Generator</div>
    <h1>Arcana <span>Pairing</span> Oracle</h1>
    <p class="sub">40 possible combinations of theme and luxe style — let the oracle suggest one, with the reasoning behind it.</p>
    <div class="sigil-divider"></div>
  </header>

  <section class="panel">
    <button class="btn btn-primary" id="drawBtn">✦ Draw a Pairing</button>

    <div class="result-card" id="resultCard">
      <div class="pairing-row">
        <div class="pairing-chip" id="themeChip"></div>
        <div class="pairing-plus">+</div>
        <div class="pairing-chip" id="styleChip"></div>
      </div>
      <div class="reasoning" id="reasoning"></div>
      <div class="toolbar">
        <button class="btn-ghost" id="anotherBtn">🎲 Draw another pairing</button>
      </div>
    </div>
  </section>
</div>

<script>
(function(){
  const c = document.querySelector('.stars'); const ctx = c.getContext('2d');
  function resize(){ c.width = innerWidth; c.height = innerHeight; } resize(); addEventListener('resize', resize);
  const stars = Array.from({length:90}, () => ({ x: Math.random()*innerWidth, y: Math.random()*innerHeight, r: Math.random()*1.2+0.2, a: Math.random(), s: Math.random()*0.015+0.003 }));
  function tick(){ ctx.clearRect(0,0,c.width,c.height); stars.forEach(st=>{ st.a += st.s; const op=(Math.sin(st.a)+1)/2*0.7+0.1; ctx.beginPath(); ctx.fillStyle=`rgba(183,140,214,${op})`; ctx.arc(st.x, st.y, st.r, 0, 7); ctx.fill(); }); requestAnimationFrame(tick); } tick();
})();

function randomOf(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

// Reused directly from the app's own theme/style data
const THEMES = ["Dark Goddess Oracle", "Crystal Witch Deck", "Gothic Shadow Tarot", "Botanical Grimoire Oracle"];
const LUXE_STYLES = [
  "Chrome Liquid Metal", "Holographic Foil", "Embossed Foil-Stamp", "Opalescent Pearl",
  "Neon Mystic", "Bioluminescent Fantasy", "Celestial Nebula", "Double-Exposure Mystic",
  "Opulent Baroque Gemstone", "Dark Academia Ink & Gold"
];

// Short reasoning fragments, recombined per draw — not a fixed lookup table
const REASON_OPENERS = [
  "This pairing works because",
  "The combination lands well since",
  "These two reinforce each other because",
  "It's a strong match because",
  "This works particularly well because"
];
const REASON_MIDDLES = [
  "the finish adds exactly the kind of visual weight this theme's symbolism already implies",
  "the style's core mood matches the emotional register of the theme almost exactly",
  "the reflective or luminous quality gives the theme's imagery somewhere to physically catch the eye",
  "the theme's palette and the style's natural tonal range don't fight each other",
  "collectors browsing this niche specifically respond to this exact combination of mood and finish",
  "the style adds a premium quality to a theme that already reads as high-value on its own"
];
const REASON_CLOSERS = [
  "— worth testing as a standalone listing on its own.",
  "— a strong candidate for a limited or signature-tier product.",
  "— likely to stand out clearly against more conventional decks in the same niche.",
  "— a pairing that photographs well for a strong thumbnail, too.",
  "— one of the more distinctive combinations available in the full style set."
];

function draw(){
  const theme = randomOf(THEMES);
  const style = randomOf(LUXE_STYLES);
  const reasoning = `${randomOf(REASON_OPENERS)} ${randomOf(REASON_MIDDLES)} ${randomOf(REASON_CLOSERS)}`;

  document.getElementById('themeChip').textContent = theme;
  document.getElementById('styleChip').textContent = style;
  document.getElementById('reasoning').innerHTML = reasoning;
  document.getElementById('resultCard').classList.add('show');
}

document.getElementById('drawBtn').addEventListener('click', draw);
document.getElementById('anotherBtn').addEventListener('click', draw);
</script>
</body>
</html>
